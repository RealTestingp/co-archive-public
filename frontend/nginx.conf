server {
    # nginx's default port. This is the port our frontend Dockerfile
    # EXPOSEs and what Azure Container Apps routes ingress traffic to.
    listen 80;

    location / {
        # Serve the static files produced by `npm run build`.
        root /usr/share/nginx/html;
        index index.html;

        # Makes React Router work. If the requested path doesn't match a real
        # file (e.g. a direct visit to /search), serve index.html instead and
        # let React Router handle the routing from there.
        try_files $uri $uri/ /index.html;
    }
}