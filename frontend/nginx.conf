server {
    listen 80;

    large_client_header_buffers 4 32k;

    resolver 168.63.129.16 valid=10s;

    location /api/ {
        set $gateway_upstream https://gateway.politeglacier-fb6c27b1.canadacentral.azurecontainerapps.io;
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name gateway.politeglacier-fb6c27b1.canadacentral.azurecontainerapps.io;
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}