services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_ENTRA_CLIENT_ID=${VITE_ENTRA_CLIENT_ID}
        - VITE_ENTRA_TENANT_ID=${VITE_ENTRA_TENANT_ID}
    ports:
      - "5173:80"
    depends_on:
      - gateway

  gateway:
    build:
      context: ./gateway/COArchive.Gateway
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - core-api

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    ports:
      - "7136:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - AzureAd__TenantId=${AZURE_TENANT_ID}
      - AzureAd__ClientId=${AZURE_CLIENT_ID}
      - AzureAd__Audience=${AZURE_CLIENT_ID}

  reports-service:
    build:
      context: ./services/reports-service
      dockerfile: Dockerfile
    ports:
      - "5200:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}

  chatbot-service:
    build:
      context: ./services/chatbot-service/ChatbotService
      dockerfile: Dockerfile
    ports:
      - "5194:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AzureAI__Endpoint=${AZURE_AI_ENDPOINT}
      - AzureAI__ModelDeployment=${AZURE_AI_MODEL_DEPLOYMENT}
      - AzureAI__ApiKey=${AZURE_AI_API_KEY}
      - AzureSearch__Endpoint=${AZURE_SEARCH_ENDPOINT}
      - AzureSearch__ApiKey=${AZURE_SEARCH_API_KEY}
      - AzureSearch__IndexName=${AZURE_SEARCH_INDEX_NAME}
      - AzureAI__EmbeddingDeployment=${AZURE_AI_EMBEDDING_DEPLOYMENT}